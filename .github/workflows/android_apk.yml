name: Build Messaoud Color Pro
on: [push, workflow_dispatch]
jobs:
  test-and-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Unit Tests
        run: PYTHONPATH=. python -m unittest discover -s tests -v
      - name: Upload Offline App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: MessaoudColorPro-Release
          path: |
            app.py
            core/
            database/
            ui/
            data/templates/
